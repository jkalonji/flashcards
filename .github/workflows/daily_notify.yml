name: Daily flashcard session

on:
  schedule:
    # 13h30 Europe/Brussels en été (CEST = UTC+2)
    # Changer en "30 12 * * *" en hiver (CET = UTC+1)
    - cron: '30 11 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Write Google token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python -c "import os; open('bot/token.json', 'w').write(os.environ['GOOGLE_TOKEN_JSON'])"

      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python bot/notify.py

      - name: Run bot (1 heure)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: timeout 3600 python bot/main.py || true
